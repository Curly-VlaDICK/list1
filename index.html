<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра: Диалог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Составь диалог</h1>

        <div class="game-area">
            <div class="source-area" id="source-area">
                <!-- Реплики будут вставляться сюда -->
            </div>

            <div class="target-area" id="target-area">
                <!-- Сюда нужно перетаскивать реплики -->
            </div>
        </div>

        <button id="check-button">Проверить</button>
        <button id="reset-button">Заново</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
