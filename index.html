<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра: Расставь реплики по порядку</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Расставь реплики по порядку</h1>

        <div id="draggable-replicas" class="replicas-container">
            <!-- Реплики будут добавлены сюда через JavaScript -->
        </div>

        <div id="drop-zone" class="drop-zone">
            Перетащите сюда реплики
        </div>

        <button id="check-button">Проверить</button>

        <div id="result" class="result">
            <!-- Тут будет отображаться результат -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
