<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра: Расставь фразы по порядку</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Расставь фразы по порядку</h1>

        <div class="game-wrapper">
            <div class="phrase-bank phrase-area" id="phrase-bank">
                <!-- Фразы будут добавлены сюда JavaScript -->
            </div>

            <div class="sequence-area phrase-area" id="sequence-area">
                <!-- Место для перетаскивания фраз -->
            </div>
        </div>

        <button id="check-button">Проверить</button>
        <button id="reset-button">Заново</button>

        <div id="result-message" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
