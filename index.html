<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра: Расставь реплики</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Расставь реплики в правильном порядке</h1>
        <div class="game-area">
            <div id="sourceArea" class="area">
                <h2>Реплики:</h2>
            </div>
            <div id="targetArea" class="area">
                <h2>Тут будет порядок:</h2>
            </div>
        </div>
        <div class="controls">
            <button id="checkButton">Проверить</button>
            <button id="resetButton">Заново</button>
        </div>
        <div id="result" class="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
