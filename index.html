<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра: Расставь реплики по порядку</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Расставь реплики по порядку</h1>

        <div class="game-area">
            <div class="source-area" id="sourceArea">
                <!-- Реплики будут добавлены сюда JavaScript'ом -->
            </div>

            <div class="target-area" id="targetArea">
                <!-- Место для перетаскивания реплик -->
            </div>
        </div>

        <div class="result-area" id="resultArea">
            <!-- Здесь будет отображаться результат -->
        </div>

        <button id="resetButton">Начать заново</button>

         <div class="original-order" id="originalOrder">
            <h2>Правильный порядок:</h2>
            <ul id="orderList">
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
